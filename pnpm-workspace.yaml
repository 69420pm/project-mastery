allowBuilds:
  agent-browser: false
  sharp: false
  unrs-resolver: false
  "@swc/core": false
  cbor-extract: false
  esbuild: false

# react-pdf loads the PDF.js worker by package path, so pdfjs-dist must be
# resolvable from the app. Hoisting keeps it at the version react-pdf pins.
publicHoistPattern:
  - pdfjs-dist

# pdfjs-dist ships its own @napi-rs/canvas, and two copies do not accept each
# other's Path2D. Keep one, the app's, for rendering PDF pages.
catalog:
  "@napi-rs/canvas": 1.0.12
overrides:
  "@napi-rs/canvas": "catalog:"
