name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # Coverage has no threshold and nothing reads its report, so CI runs the
      # tests without it, as `pnpm check` does.
      - run: pnpm test:run

  build-e2e:
    name: Build & E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Signed-in tests create test Students in local Supabase, as in the
      # database job. The app runs with AI_PROVIDER=mock (playwright.config.ts).
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      # A runner sometimes still holds one of Supabase's ports ("failed to bind
      # host port ... address already in use"); a second start gets through.
      - name: Start Supabase
        run: |
          start() { supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta; }
          start || { supabase stop --no-backup; sleep 5; start; }
      - name: Point the app and tests at local Supabase
        run: |
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The agent CLI (run-app skill) signs in through the real login form, so
      # a change to that flow fails here, not in the next agent run.
      - name: Smoke-test the agent CLI
        run: |
          pnpm -s agent up
          pnpm -s agent login student
          pnpm -s agent down
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  database:
    name: Database lint, policy tests & types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installs the CLI version pinned in pnpm-lock.yaml.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      # Only Postgres, Auth, Storage and the API gateway are needed here. The
      # second start is for a port the runner still holds, as in the e2e job.
      - name: Start Supabase
        run: |
          start() { supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta; }
          start || { supabase stop --no-backup; sleep 5; start; }
      - run: supabase db lint --local --fail-on error
      - run: supabase test db
      - name: Check that generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts \
            || { echo "::error::Database types are out of date. Run pnpm db:types and commit the result."; exit 1; }
