name: Bug report
description: Something isn't working as expected
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser, OS, deployment URL"
  - type: textarea
    id: context
    attributes:
      label: Screenshots / logs
      description: Anything else that helps. Logs are formatted as code automatically.
      render: shell
